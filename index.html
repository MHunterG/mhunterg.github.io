<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vladimir Ivanov · Go engineer, ML infrastructure</title>
    <meta
      name="description"
      content="Vladimir Ivanov (MHunterG) builds the Go systems that serve machine learning in production. After hours he makes native ports of PSP games by static recompilation."
    />
    <meta name="author" content="Vladimir Ivanov" />
    <link rel="canonical" href="https://mhunterg.github.io/" />

    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0c0c0b" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f1ede4" media="(prefers-color-scheme: light)" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mhunterg.github.io/" />
    <meta property="og:site_name" content="Vladimir Ivanov" />
    <meta property="og:title" content="Vladimir Ivanov · Go engineer, ML infrastructure" />
    <meta
      property="og:description"
      content="Go systems that serve machine learning in production, and native ports of PSP games by static recompilation."
    />
    <meta property="og:image" content="https://mhunterg.github.io/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Vladimir Ivanov: a horned wolf’s head in a ring, on black" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="preload" href="/fonts/archivo.woff2" as="font" type="font/woff2" crossorigin />

    <script>
      // Pick the theme before the first paint: a saved choice, else the system's.
      ;(function () {
        var t
        try {
          t = localStorage.getItem('theme')
        } catch (e) {}
        if (t !== 'light' && t !== 'dark')
          t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        document.documentElement.dataset.theme = t
      })()
    </script>
  </head>
  <body>
    <div id="root"><!--app--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
